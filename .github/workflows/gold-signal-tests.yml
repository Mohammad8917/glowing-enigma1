name: GOLD Signal Bot Tests

on:
  push:
    branches:
      - feature/gold-data-reliability
  pull_request:
    branches:
      - feature/gold-xauusd-telegram-signals
    paths:
      - "tools/gold_signal_bot/**"
      - ".github/workflows/gold-signal-tests.yml"

permissions:
  contents: read

jobs:
  offline-tests:
    name: GOLD offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/gold_signal_bot/requirements.txt

      - name: Verify exactly 60 test methods are present
        run: |
          python -c "import ast, pathlib; p=pathlib.Path('tools/gold_signal_bot/test_gold_signal_bot.py'); t=ast.parse(p.read_text(encoding='utf-8')); n=sum(isinstance(x,(ast.FunctionDef,ast.AsyncFunctionDef)) and x.name.startswith('test_') for c in t.body if isinstance(c,ast.ClassDef) for x in c.body); print(f'Discovered test methods: {n}'); assert n == 60, f'Expected 60 tests, found {n}'"

      - name: Compile bot and test module
        run: |
          python -m py_compile tools/gold_signal_bot/gold_signal_bot.py tools/gold_signal_bot/test_gold_signal_bot.py

      - name: Run complete offline test suite
        run: |
          python -m unittest discover -s tools/gold_signal_bot -p "test_*.py" -v
